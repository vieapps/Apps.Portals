<ion-header>
	<ion-toolbar [color]="color">
		<ion-buttons slot="start">
			<ion-back-button text=""></ion-back-button>
		</ion-buttons>
		@if (canEdit) {
			<ion-buttons slot="end">
				<ion-button fill="clear" color="primary" (click)="update()">
					{{ resources.update }}
				</ion-button>
			</ion-buttons>
		}
		<ion-title>
			{{ title.page }}
		</ion-title>
	</ion-toolbar>
</ion-header>

<ion-footer>
	<ion-toolbar [color]="color">
		@if (change) {
			<ion-buttons slot="start">
				<ion-button (click)="moderate(change.status)">
					<ion-icon name="shield-checkmark" slot="start"></ion-icon>
					{{ change.button }}
				</ion-button>
			</ion-buttons>
		}
		@if (actions) {
			<ion-buttons slot="end">
				<ion-button color="primary" (click)="showActions()">
					<ion-icon name="ellipsis-horizontal" slot="icon-only"></ion-icon>
				</ion-button>
			</ion-buttons>
		}
	</ion-toolbar>
</ion-footer>

<ion-content [color]="color" class="ion-padding">
	@if (formConfig) {
		<app-form		
			[color]="color"
			[config]="formConfig"
			[controls]="formControls"
			[asViewControls]="true"
			(init)="onFormInitialized()"></app-form>
	}
</ion-content>
