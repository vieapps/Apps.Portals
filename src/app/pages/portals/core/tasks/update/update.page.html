<ion-header>
	<ion-toolbar [color]="color">
		<ion-buttons slot="start">
			<ion-button fill="clear" color="secondary" [disabled]="processing" (click)="cancelAsync()">
				{{ button.cancel }}
			</ion-button>
		</ion-buttons>
		<ion-buttons slot="end">
			<ion-button fill="clear" color="primary" [disabled]="processing || !canUpdate" (click)="saveAsync()">
				{{ button.save }}
			</ion-button>
		</ion-buttons>
		<ion-title>
			{{ title }}
		</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content [color]="color" class="ion-padding">
	@if (formConfig) {
		<app-form
			[color]="color"
			[form]="form"
			[config]="formConfig"
			[controls]="formControls"
			(init)="onFormInitialized()"></app-form>
	}
</ion-content>
