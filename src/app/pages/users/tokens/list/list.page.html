<ion-header>
	<ion-toolbar [color]="color">
		<ion-buttons slot="start">
			<ion-back-button text=""></ion-back-button>
		</ion-buttons>
		<ion-buttons *ngIf="!searching" slot="end">
			<ion-button title="Search" (click)="openSearchAsync()">
				<ion-icon name="search" slot="icon-only"></ion-icon>
			</ion-button>
		</ion-buttons>
		<ion-title [hidden]="searching">
			{{ title }}
		</ion-title>
		<ion-searchbar [hidden]="!searching"
			(ionChange)="onStartSearch($event)"
			(ionClear)="onClearSearch()"
			(ionCancel)="onCancelSearch()"></ion-searchbar>
	</ion-toolbar>
</ion-header>

<ion-footer *ngIf="pagination">
	<ion-toolbar [color]="color">
		<span class="ion-float-start" slot="start">
			<ion-icon name="qr-code" color="primary" slot="start"></ion-icon>
			<span>
				{{ totalRecords | number:'':locale }} / {{ pagination.TotalRecords | number:'':locale }}	
			</span>
		</span>
		<span [hidden]="pagination.TotalPages < 2" class="ion-padding-end" slot="end">
			<ion-icon name="code" color="primary" slot="start"></ion-icon>
			<span>
				{{ pageNumber | number:'':locale }} / {{ pagination.TotalPages | number:'':locale }}
			</span>
		</span>
	</ion-toolbar>
</ion-footer>

<ion-content [color]="color">
	<ion-fab vertical="bottom" horizontal="end" slot="fixed">
		<ion-fab-button (click)="create()">
			<ion-icon name="add"></ion-icon>
		</ion-fab-button>
  </ion-fab>
	<ion-list class="ion-padding-end">
		<ion-item *ngFor="let token of tokens; trackBy: track" [color]="color" [routerLink]="token.routerLink" [queryParams]="token.routerParams" routerDirection="forward" detail="false">
			<ion-label>
				<label class="time ion-float-end">
					<span>
						{{ token.Created | date:'h:mm a @ d/M/y' }}
					</span>
					<span>
						{{ token.LastAccess | time:locale:'h:mm a @ d/M/y':false }}
					</span>
				</label>
				<h2>
					{{ token.Title }}
				</h2>
				<div *ngIf="token.user">
					{{ token.user.Name }}
					(<span>{{ token.user.Email }}</span>)
				</div>
			</ion-label>
		</ion-item>
	</ion-list>
	<ion-infinite-scroll threshold="288px" position="bottom" (ionInfinite)="onInfiniteScrollAsync()">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</ion-content>
