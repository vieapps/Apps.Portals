<ion-header>
	<ion-toolbar [color]="color">
		<ion-buttons slot="start">
			<ion-menu-button></ion-menu-button>
		</ion-buttons>
		<div *ngIf="showStatistics && statistics.Sessions && statistics.Sessions.Total" slot="end" class="ion-padding-end">
			<ion-icon name="person-circle-outline" color="primary" slot="start"></ion-icon>
			<span>
				{{ statistics.Sessions.User | number:'':locale }}
			</span>
			<ion-icon name="people-circle-outline" color="secondary" slot="start"></ion-icon>
			<span>
				{{ statistics.Sessions.Visitor | number:'':locale }}
			</span>
			<ion-icon name="people-outline" color="medium" lot="start"></ion-icon>
			<span>
				{{ statistics.Sessions.Total | number:'':locale }}
			</span>
			<ion-icon name="pulse-outline" color="danger" slot="start"></ion-icon>
			<span>
				{{ statistics.Visits.Day | number:'':locale }}
			</span>
			<ion-icon name="pulse-outline" color="warning" slot="start"></ion-icon>
			<span>
				{{ statistics.Visits.Month | number:'':locale }}
			</span>
		</div>
		<ion-title>
			{{ title }}
		</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content [color]="color">
	<control-cms-portals-shortcuts *ngIf="isAuthenticated && activeService === 'Portals'"></control-cms-portals-shortcuts>
	<control-cms-portals-featured-contents *ngIf="isAuthenticated && activeService === 'Portals'" name="updated"></control-cms-portals-featured-contents>
	<control-cms-portals-featured-contents *ngIf="isAuthenticated && activeService === 'Portals'" name="published" status="Published" orderBy="Date"></control-cms-portals-featured-contents>
	<control-app-preferences *ngIf="!isAuthenticated && activeService === 'Portals'"></control-app-preferences>
	<control-books-featured *ngIf="activeService === 'Books'"></control-books-featured>
</ion-content>
