<ion-grid class="ion-padding">
	<ion-row>
		<ion-col size="12" class="title ion-padding-top">
			<span class="ion-float-end">
				<ion-icon (click)="create($event)" name="add" color="medium" slot="icon-only"></ion-icon>
			</span>
			{{ label }}
		</ion-col>
	</ion-row>
	<ion-row>
		@for (shortcut of shortcuts; track track($index, shortcut); let idx = $index) {
			<ion-col size="12" size-lg="6">
				<ion-item [color]="color" (click)="navigate(shortcut, idx, $event)" class="ion-activatable" detail="false" lines="none">
					@if (shortcut.Icon && shortcut.Icon.Name) {
						<ion-icon [name]="shortcut.Icon.Name" [color]="shortcut.Icon.Color" slot="start"></ion-icon>
					}
					<ion-label>
						<span class="ion-float-end">
							@if (shortcut.OtherAction && shortcut.OtherAction.Icon) {
								<ion-icon (click)="click(shortcut, idx, $event)" [name]="shortcut.OtherAction.Icon" color="medium" slot="icon-only" class="ion-padding-end"></ion-icon>
							}
							@if (shortcut.Editable) {
								<ion-icon (click)="update(shortcut, idx, $event)" name="create" color="medium" slot="icon-only"></ion-icon>
							}
							@if (shortcut.Removable) {
								<ion-icon (click)="remove(shortcut, idx, $event)" name="trash" color="medium" slot="icon-only"></ion-icon>
							}
						</span>
						{{ shortcut.Title }}
					</ion-label>
				</ion-item>
			</ion-col>
		}
	</ion-row>
</ion-grid>
