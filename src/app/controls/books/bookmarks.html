<ion-list #list class="ion-margin-vertical">
	@if (bookmarks.length > 0) {
		<ion-list-header [color]="color">
			<ion-label>
				{{ labels.header }}
			</ion-label>
		</ion-list-header>
	}
	@for (bookmark of bookmarks; track bookmark.ID) {
		<ion-item-sliding>
			<ion-item [color]="color" (click)="open(bookmark)" class="ion-activatable" detail="false">
				<div>
					<h2>
						{{ getTitle(bookmark) }}
					</h2>
					<div>
						<label>
							{{ bookmark.Time | time:locale:'h:mm a @ d/M/y' }}
						</label>
						<span>
							{{ getPosition(bookmark) }}
						</span>
					</div>
				</div>
			</ion-item>
			<ion-item-options>
				<ion-item-option color="primary" (click)="open(bookmark)">
					<ion-icon name="book"></ion-icon>
					{{ labels.buttons.read }}
				</ion-item-option>
				<ion-item-option color="danger" (click)="delete(bookmark)">
					<ion-icon name="trash"></ion-icon>
					{{ labels.buttons.delete }}
				</ion-item-option>
			</ion-item-options>
		</ion-item-sliding>
	}
	@if (profile && bookmarks.length > 0) {
		<ion-item [color]="color" class="sync">
			<div>
				<span class="ion-float-end">
					<label>
						{{ labels.footer }} {{ profile.LastSync | time:locale:'h:mm a @ d/M/y' }}
					</label>
					<ion-button fill="clear" slot="end" (click)="send()">
						<ion-icon name="cloud-upload" slot="icon-only"></ion-icon>
					</ion-button>
				</span>
			</div>
		</ion-item>
	}
</ion-list>
