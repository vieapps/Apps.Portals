<ion-item [color]="color" (click)="open()" detail="false">
	<ion-label>
		<ion-thumbnail class="ion-float-start ion-padding-end">
			<img [src]="book.Cover" />
		</ion-thumbnail>
		<div>
			<div>
				@if (!hideAuthor) {
					<span>
						{{ book.Author }}
					</span>
				}
				@if (!hideCategory) {
					<span>
						{{ book.Category }}
					</span>
				}
				<label class="ion-float-end">
					@if (book.TotalChapters > 1) {
						<span>
							<span class="chapters">
								{{ book.TotalChapters | number:'':locale }}
							</span>
							<ion-icon name="copy" slot="end"></ion-icon>
						</span>
					}
				</label>
			</div>
			<h2>
				{{ book.Title }}
			</h2>
		</div>
	</ion-label>
</ion-item>
