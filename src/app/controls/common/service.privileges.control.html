<ion-list>
	<ion-item [color]="color">
		<ion-label [position]="labelPosition">
			{{ labels.service }}
		</ion-label>
		<ion-select interface="alert"
			[okText]="labels.buttons.ok"
			[cancelText]="labels.buttons.cancel"
			[value]="serviceRole"
			(ionChange)="onServiceRoleChanged($event)">
			@for (role of roles; track role) {
				<ion-select-option [value]="role">{{ labels.roles[role] }}</ion-select-option>
			}
		</ion-select>
	</ion-item>
	<ion-list>
		<ion-list-header [color]="color">
			<ion-label>
				{{ labels.other }}
			</ion-label>
		</ion-list-header>
		@for (objectRole of objectRoles; track objectRole.name) {
			<ion-item [color]="color">
				<ion-label [position]="labelPosition">
					{{ labels.objects[objectRole.name] }}
				</ion-label>
				<ion-select interface="alert"
					[disabled]="serviceRole !== 'Viewer'"
					[okText]="labels.buttons.ok"
					[cancelText]="labels.buttons.cancel"
					[value]="objectRole.role"
					(ionChange)="onObjectRoleChanged($event, objectRole.name)">
					@for (role of roles; track role) {
						<ion-select-option [value]="role">{{ labels.roles[role] }}</ion-select-option>
					}
				</ion-select>
			</ion-item>
		}
	</ion-list>
</ion-list>
